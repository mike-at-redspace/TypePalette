<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/img/favicon-96x96.png"
    />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />

    <!-- Web Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary Meta Tags -->
    <title>TypePalette</title>
    <meta name="title" content="TypePalette " />
    <meta
      name="description"
      content="Create and configure beautiful typography systems with TypePalette. Customize fonts, weights, tracking, leading, and more for headings, body text, and UI elements."
    />
    <meta
      name="keywords"
      content="typography, font configuration, type scale, web typography, font pairing, typography tool, design tool, CSS typography"
    />
    <meta name="author" content="TypePalette" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0094ff" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="TypePalette - Typography Configuration Tool"
    />
    <meta
      property="og:description"
      content="Create and configure beautiful typography systems with TypePalette. Customize fonts, weights, tracking, leading, and more for headings, body text, and UI elements."
    />
    <meta property="og:image" content="/img/og-image.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="TypePalette - Typography Configuration Tool"
    />
    <meta
      property="twitter:description"
      content="Create and configure beautiful typography systems with TypePalette. Customize fonts, weights, tracking, leading, and more for headings, body text, and UI elements."
    />
    <meta property="twitter:image" content="/img/og-image.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
